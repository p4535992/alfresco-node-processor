name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 0.9.1)'
        required: true
        default: '0.9.1'
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 and Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate release version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be in X.Y.Z format."
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} already exists."
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$VERSION" >> "$GITHUB_ENV"

      - name: Prepare release POM (tag-only commit)
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp versions:set "-DnewVersion=$RELEASE_VERSION" -DgenerateBackupPoms=false
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $RELEASE_TAG"
          fi

      - name: Build executable distribution
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -DskipTests -Dlicense.skip=true clean package
          test -s target/anp.jar

      - name: Publish Git tag
        shell: bash
        run: |
          set -euo pipefail
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create GitHub release with executable JAR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Alfresco Node Processor $RELEASE_TAG

          - Executable application: download \`anp.jar\` below.
          - Maven (JitPack): \`com.github.p4535992:alfresco-node-processor:$RELEASE_TAG\`
          - Repository: https://jitpack.io
          EOF
          gh release create "$RELEASE_TAG" target/anp.jar \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Verify JitPack Maven artifact
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if mvn -B -ntp -U org.apache.maven.plugins:maven-dependency-plugin:3.7.1:get \
              "-Dartifact=com.github.p4535992:alfresco-node-processor:$RELEASE_TAG" \
              "-DremoteRepositories=jitpack::default::https://jitpack.io" \
              -Dtransitive=false; then
              echo "JitPack artifact is available."
              exit 0
            fi
            echo "JitPack not ready (attempt $attempt/5); retrying..."
            sleep 45
          done
          echo "::error::JitPack artifact was not available; inspect https://jitpack.io/#p4535992/alfresco-node-processor"
          exit 1
